apiVersion: apps/v1
kind: Deployment
metadata:
  name: helloapi
  labels:
    app: helloapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: helloapi
  template:
    metadata:
      labels:
        app: helloapi
    spec:
      containers:
        - name: helloapi
          image: localhost:5001/helloapi:latest
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: helloapi
spec:
  selector:
    app: helloapi
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
