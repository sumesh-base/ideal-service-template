version: 2
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Maintain dependencies for .NET (NuGet)
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"

  # Maintain Docker base images
  - package-ecosystem: "docker"
    directory: "/src/IdealService"
    schedule:
      interval: "weekly"
