name: Build and Push Container Image

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*.*.*'
    paths-ignore:
      - 'manifests/**'
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - 'manifests/**'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract Version from version.yaml
        id: get_version
        run: |
          # Extract the version string from version.yaml
          APP_VERSION=$(grep '^version:' version.yaml | awk '{print $2}' | tr -d '"' | tr -d "'")
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log into GitHub Container Registry
        # PRs build the image but do not publish it.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/ideal-service
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ env.APP_VERSION }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: src/IdealService
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: 'v3.13.0'

      - name: Package Helm chart
        run: |
          helm package k8s/ideal-service --version "${{ env.APP_VERSION }}" --app-version "${{ env.APP_VERSION }}"

      - name: Push Helm chart to GHCR
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push ideal-service-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
