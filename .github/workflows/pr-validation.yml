name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - master
    paths-ignore:
      - 'manifests/**'

jobs:
  enforce-pr-standards:
    name: Enforce PR Standards
    runs-on: ubuntu-latest
    steps:
      - name: Check PR Standards
        env:
          BRANCH_NAME: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [[ "$BRANCH_NAME" == release-please--* ]] || [[ "$BRANCH_NAME" == dependabot/* ]]; then
            echo "Branch is created by a bot. Skipping PR standards check."
            exit 0
          fi
          
          # Check branch name for Jira ticket
          if [[ ! "$BRANCH_NAME" =~ [A-Z]+-[0-9]+ ]]; then
            echo "::error::Branch name must contain a Jira ticket number (e.g., PROJ-123). Your branch name: $BRANCH_NAME"
            exit 1
          fi
          
          # Check PR title for Conventional Commits
          if [[ ! "$PR_TITLE" =~ ^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-zA-Z0-9_-]+\))?:\ .+ ]]; then
            echo "::error::PR title must follow Conventional Commits syntax (e.g., 'feat: add login', 'fix: resolve crash'). Your title: $PR_TITLE"
            exit 1
          fi
          
          # Check PR description for Jira ticket
          if [[ ! "$PR_BODY" =~ [A-Z]+-[0-9]+ ]]; then
            echo "::error::PR description must contain a Jira ticket number (e.g., PROJ-123). Please update your PR body."
            exit 1
          fi
          
          echo "All PR standards are valid!"

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run Tests
        run: dotnet test src/IdealService.Tests/IdealService.Tests.csproj -c Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: PR .NET Tests
          path: TestResults/*.trx
          reporter: dotnet-trx
