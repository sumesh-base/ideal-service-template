name: PR Validation

on:
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - 'manifests/**'

jobs:
  enforce-jira-branch:
    name: Enforce Jira Ticket in Branch Name
    runs-on: ubuntu-latest
    steps:
      - name: Check branch name
        run: |
          BRANCH_NAME="${{ github.head_ref }}"
          if [[ ! "$BRANCH_NAME" =~ [A-Z]+-[0-9]+ ]]; then
            echo "::error::Branch name must contain a Jira ticket number (e.g., PROJ-123). Your branch name: $BRANCH_NAME"
            exit 1
          fi
          echo "Branch name is valid!"

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Run Tests
        run: dotnet test src/IdealService.Tests/IdealService.Tests.csproj -c Release --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Publish Test Results
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: PR .NET Tests
          path: TestResults/*.trx
          reporter: dotnet-trx
